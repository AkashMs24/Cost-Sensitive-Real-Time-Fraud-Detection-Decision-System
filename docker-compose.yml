# Run both services together locally:  docker compose up --build
# API:       http://localhost:8000/docs
# Dashboard: http://localhost:8501

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-groq}

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    ports:
      - "8501:8501"
    environment:
      - FRAUD_API_URL=http://api:8000
    depends_on:
      - api
